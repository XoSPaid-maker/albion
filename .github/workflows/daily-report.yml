name: Albion daily market report

on:
  schedule:
    - cron: "15 11 * * *"   # 11:15 UTC = 6:15 a. m. Bogotá (informe listo antes de las 7)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 10
          --shm-size=1g
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client python3-psycopg2
      - name: ETL (descargar volcado AODP, restaurar, calcular)
        run: python3 etl/build_report.py
      - name: Guardar informe en el repositorio
        run: |
          git config user.name "albion-bot" && git config user.email "bot@users.noreply.github.com"
          git add docs/data/latest.json docs/data/market.json docs/data/report.md
          git commit -m "Informe diario $(date -u +%F)" || echo "sin cambios"
          git push
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: deploy
        uses: actions/deploy-pages@v4
