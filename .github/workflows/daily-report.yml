name: Albion daily market report

on:
  schedule:
    - cron: "15 11 * * *"   # 11:15 UTC = 6:15 a. m. Bogotá (informe listo antes de las 7)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas (MySQL del runner + pymysql)
        run: |
          sudo systemctl start mysql || (sudo apt-get update -qq && sudo apt-get install -y -qq mysql-server && sudo systemctl start mysql)
          sudo apt-get install -y -qq python3-pymysql || pip install pymysql
          mysql -h127.0.0.1 -uroot -proot --protocol=tcp -e "SELECT VERSION();"
          df -h / && free -m
      - id: etl
        name: ETL (descargar volcado AODP, restaurar, calcular)
        shell: bash
        run: |
          set -o pipefail
          python3 -u etl/build_report.py 2>&1 | tee etl.log
      - name: Guardar informe y log en el repositorio
        if: always()
        shell: bash
        run: |
          mkdir -p docs/data
          { echo "# run ${{ github.run_id }} · $(date -u +'%F %T') UTC · conclusión del ETL: ${{ steps.etl.outcome }}"; head -n 250 etl.log; echo "[...]"; tail -n 250 etl.log; } > docs/data/etl.log
          git config user.name "albion-bot" && git config user.email "bot@users.noreply.github.com"
          git add -A docs/data
          git commit -m "Informe diario $(date -u +%F)" || echo "sin cambios"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/configure-pages@v5   # Pages debe estar activado (Settings → Pages → Source: GitHub Actions)
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: docs }
      - id: deploy
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
