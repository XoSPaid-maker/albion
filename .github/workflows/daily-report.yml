name: Albion daily market report

on:
  schedule:
    - cron: "15 11 * * *"   # 11:15 UTC = 6:15 a. m. Bogotá (informe listo antes de las 7)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 10
          --shm-size=1g
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client python3-psycopg2
      - id: etl
        name: ETL (descargar volcado AODP, restaurar, calcular)
        shell: bash
        run: |
          set -o pipefail
          python3 -u etl/build_report.py 2>&1 | tee etl.log
      - name: Guardar informe y log en el repositorio
        if: always()
        shell: bash
        run: |
          mkdir -p docs/data
          { echo "# run ${{ github.run_id }} · $(date -u +'%F %T') UTC · conclusión del ETL: ${{ steps.etl.outcome || 'ver arriba' }}"; tail -n 400 etl.log; } > docs/data/etl.log
          git config user.name "albion-bot" && git config user.email "bot@users.noreply.github.com"
          git add -A docs/data
          git commit -m "Informe diario $(date -u +%F)" || echo "sin cambios"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: docs }
      - id: deploy
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
